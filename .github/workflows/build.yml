name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # `npm ci` runs `wxt prepare` (postinstall), which generates .wxt/.
      - run: npm ci
      - run: npm test
      - run: npm run check

      # Production build (.env.production -> freehire.me),
      # zipped exactly as it is uploaded to the Chrome Web Store.
      - run: npm run zip

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3
          path: extension/.output/*.zip
          # .output is a dotted directory, and upload-artifact skips hidden
          # paths unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
